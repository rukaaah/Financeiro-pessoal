# Instale com: uv run pre-commit install
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Trava extratos reais e credenciais antes do commit: o repo é público.
  - repo: local
    hooks:
      - id: sem-extratos-reais
        name: nenhum extrato real (*.pdf, *.ofx) fora de tests/fixtures
        entry: >-
          bash -c 'bad=$(printf "%s\n" "$@" | grep -Ei "\.(pdf|ofx)$" | grep -v "^tests/fixtures/" || true);
          if [ -n "$bad" ]; then echo "Extrato real barrado:"; echo "$bad"; exit 1; fi' --
        language: system
        pass_filenames: true
      - id: sem-segredos
        name: nenhum arquivo de segredo versionado
        # .env.example / .env.sample são modelos sem credencial e passam.
        entry: >-
          bash -c 'bad=$(printf "%s\n" "$@" | grep -E "(^|/)(\.env($|\..*)|secrets\.toml|\.neon)$"
          | grep -vE "(^|/)\.env\.(example|sample|template)$" || true);
          if [ -n "$bad" ]; then echo "Arquivo de segredo barrado:"; echo "$bad"; exit 1; fi' --
        language: system
        pass_filenames: true

  # ruff, mypy e import-linter rodam via `uv run`, e não pelos repositórios
  # de hooks do pre-commit, para que haja uma única fonte de versão: o
  # uv.lock. Com `rev:` fixado à parte, a versão do hook descola da versão do
  # projeto e os dois passam a formatar diferente — foi o que aconteceu aqui,
  # com ruff v0.8.6 no hook contra 0.16.x no lock.
  #
  # `--group dev` é obrigatório: o pyproject não instala grupo por omissão, e
  # sem ele um venv sincronizado com `uv sync` puro faria o hook falhar com
  # "Failed to spawn: ruff", que não diz nada sobre a causa. Com a flag, o uv
  # instala o grupo na hora.
  - repo: local
    hooks:
      - id: ruff-format
        name: formatação (ruff, via uv)
        entry: uv run --group dev ruff format
        language: system
        types: [python]
      - id: ruff
        name: lint (ruff, via uv)
        entry: uv run --group dev ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: tipos (mypy strict, via uv)
        entry: uv run --group dev mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: fronteiras da arquitetura (import-linter, via uv)
        entry: uv run --group dev lint-imports
        language: system
        pass_filenames: false
        types: [python]
