<title>Financeiro pessoal · esboço v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
/* Layout: uma coluna de celular (máx. 440 px) centrada, barra inferior fixa; um bloco de destaque por tela. */
:root{
  --papel:#fbfbf9; --sup:#f1f2ee; --sup2:#e6e8e2; --tinta:#181b1a; --t2:#585f5c; --regua:#cdd0ca;
  --azul:#2b55d0; --heroi:#18264f; --heroi-t:#ffffff; --heroi-t2:#c9d3f3; --heroi-linha:#33437a; --azul-claro:#a9b9ef;
  --fora:#b3261e; --fora-f:#f9e2e0; --fora-t:#6d1712; --perto:#8a5a00; --perto-f:#f7ead1; --dentro:#1f6f54; --dentro-f:#e2efe9;
  --tarja:#322d1f; --tarja-t:#f6e7c4; --sombra:0 8px 32px rgb(24 27 26 / 18%);
  --fonte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#111413; --sup:#1a1e1c; --sup2:#262b28; --tinta:#e7e9e6; --t2:#a6ada8; --regua:#2f3532;
  --azul:#7d9bff; --heroi:#1b2a5c; --heroi-linha:#34477f; --azul-claro:#6f86d6;
  --fora:#ff8a80; --fora-f:#3a1d1b; --fora-t:#ffd7d3; --perto:#e8b45a; --perto-f:#352a14; --dentro:#6fcfa5; --dentro-f:#15302a;
  --sombra:0 8px 32px rgb(0 0 0 / 50%); color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#111413; --sup:#1a1e1c; --sup2:#262b28; --tinta:#e7e9e6; --t2:#a6ada8; --regua:#2f3532;
  --azul:#7d9bff; --heroi:#1b2a5c; --heroi-linha:#34477f; --azul-claro:#6f86d6;
  --fora:#ff8a80; --fora-f:#3a1d1b; --fora-t:#ffd7d3; --perto:#e8b45a; --perto-f:#352a14; --dentro:#6fcfa5; --dentro-f:#15302a;
  --sombra:0 8px 32px rgb(0 0 0 / 50%); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font:16px/1.45 var(--fonte);font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-feature-settings:"liga";font-feature-settings:"liga"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:4px}
.tarja{background:var(--tarja);color:var(--tarja-t);font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-radius:0 0 6px 6px}
.tarja b{font-weight:600}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 0 6px}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.mes{display:flex;align-items:center;gap:2px;color:var(--t2);font-size:15px;font-weight:500;margin-left:-8px}
.mes button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.icone{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;margin-right:-10px}
.heroi{background:var(--heroi);color:var(--heroi-t);border-radius:6px;padding:18px 18px 14px}
.heroi .rot{font-size:13px;color:var(--heroi-t2)}
.heroi .grande{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.heroi .conta{font-size:13px;color:var(--heroi-t2);margin:0 0 14px}
.trilho{height:14px;border-radius:999px;background:var(--heroi-linha);display:flex;overflow:hidden}
.trilho i{display:block;height:100%}
.tres{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--heroi-linha);padding-top:12px}
.tres>div+div{border-left:1px solid var(--heroi-linha);padding-left:12px}
.tres .r{font-size:12px;color:var(--heroi-t2);display:flex;align-items:center;gap:6px}
.tres .v{font-size:17px;font-weight:600}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.heroi .pe{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--heroi-t2)}
.btn-claro{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--heroi-linha);border-radius:4px;padding:8px 12px;min-height:40px;color:var(--heroi-t);font-weight:600;font-size:14px}
.achado{margin-top:12px;background:var(--fora-f);color:var(--fora-t);border-radius:6px;padding:12px 14px;display:flex;gap:10px;font-size:15px}
.achado .ms{color:var(--fora)}
section{margin-top:24px}
h2{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;text-wrap:balance}
h2 .lado{font-size:14px;color:var(--t2);font-weight:500}
h2 a,h2 button.link{font-size:14px;color:var(--azul);font-weight:600;text-decoration:none}
.lista{background:var(--sup);border-radius:6px;padding:0 14px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--sup2);width:100%;text-align:left}
.lista>.item:first-child,.grupo>.item:first-of-type{border-top:0}
.nome{font-weight:600;min-width:0}
.valor{font-weight:700;text-align:right}
.sub{font-size:14px;color:var(--t2)}
.acao{font-size:14px;font-weight:700;color:var(--azul);text-align:right}
.selo{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px;white-space:nowrap}
.selo.fora{background:var(--fora-f);color:var(--fora)}.selo.perto{background:var(--perto-f);color:var(--perto)}
.proj{background:var(--sup);border-radius:6px;padding:12px 14px}
.proj .fim{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.proj .fim b{font-size:22px;letter-spacing:-.01em}
.proj svg{display:block;width:100%;height:auto;margin-top:6px}
.grupo{background:var(--sup);border-radius:6px;padding:0 14px;margin-top:8px}
.grupo-cab{display:flex;justify-content:space-between;padding:12px 0 4px;font-size:13px;color:var(--t2);font-weight:600}
.cat .barra{grid-column:1/-1;height:3px;background:var(--sup2);border-radius:2px;margin-top:6px;overflow:hidden}
.cat .barra i{display:block;height:100%;background:var(--t2)}
.cat.fora .barra i{background:var(--fora)}.cat.perto .barra i{background:var(--perto)}
.cat .valor{font-weight:600}
.linha-total{display:flex;justify-content:space-between;padding:12px 0;font-weight:700;border-top:2px solid var(--regua);margin-top:8px}
.rodape{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--regua);border-radius:4px;padding:10px 14px;min-height:44px;font-weight:600;font-size:14px}
nav.barra{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--regua);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.barra .in{max-width:440px;margin:0 auto;height:68px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:12px;color:var(--t2)}
nav.barra button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center}
nav.barra button[aria-current="page"]{color:var(--tinta);font-weight:700}
nav.barra .lancar{width:56px;height:56px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;margin:-22px auto 0}
nav.barra .lancar .ms{font-size:30px}
.vazio{background:var(--sup);border-radius:6px;padding:20px;margin-top:16px}
/* folha inferior */
.veu{position:fixed;inset:0;background:rgb(0 0 0 / 40%);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--papel);width:100%;max-width:440px;border-radius:6px 6px 0 0;box-shadow:var(--sombra);max-height:86%;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.folha .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.folha h3{margin:0;font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{border:1px solid var(--regua);border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:14px;min-height:40px}
.msg{border-radius:6px;padding:10px 12px;margin-top:8px;font-size:15px}
.msg.eu{background:var(--sup2);margin-left:48px}
.msg.ia{background:var(--sup)}
.msg .base{display:block;font-size:13px;color:var(--t2);margin-top:6px}
.aviso{font-size:13px;color:var(--t2);margin-top:12px}
.colunas{display:flex;align-items:flex-end;gap:4px;height:110px;margin:10px 0 4px}
.colunas i{flex:1;background:var(--sup2);border-radius:2px 2px 0 0;position:relative}
.colunas i.atual{background:var(--azul)}
.colunas-rot{display:flex;justify-content:space-between;font-size:12px;color:var(--t2)}

.abas{display:flex;gap:20px;border-bottom:1px solid var(--regua);overflow-x:auto;margin:4px 0 16px}
.abas button{padding:10px 0;font-weight:500;color:var(--t2);border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.abas button[aria-selected="true"]{color:var(--tinta);font-weight:700;border-bottom-color:var(--tinta)}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta);font-weight:600}
.lote{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.lote .btn{justify-content:center}
.dia{font-size:13px;font-weight:700;color:var(--t2);padding:14px 0 6px}
.entrada{color:var(--dentro)}
.heroi .acao-heroi{display:flex;gap:8px;margin-top:14px}
.btn-cheio{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--heroi-t);color:var(--heroi);border-radius:4px;padding:10px 16px;min-height:44px;font-weight:700;font-size:15px}
.btn-tinta{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--tinta);color:var(--papel);border-radius:4px;padding:12px 16px;min-height:48px;font-weight:700;font-size:16px;width:100%}
.colfat{display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:8px}
.colfat div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--t2);height:100%;justify-content:flex-end}
.colfat i{display:block;width:100%;background:var(--sup2);border-radius:2px 2px 0 0}
.colfat .atual i{background:var(--azul)}
.partes .item{grid-template-columns:minmax(0,1fr) auto}
.menos{color:var(--t2)}
.prog{grid-column:1/-1;height:4px;background:var(--sup2);border-radius:999px;margin-top:6px;overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--tinta)}
.prog b{position:absolute;top:-3px;width:2px;height:10px;background:var(--azul)}
.aloc{display:grid;grid-template-columns:90px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.aloc .tr{height:10px;background:var(--sup2);border-radius:999px;position:relative}
.aloc .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--azul);border-radius:999px}
.aloc .tr b{position:absolute;top:-3px;width:2px;height:16px;background:var(--tinta)}
.pessoa{display:flex;align-items:center;gap:10px}
.inicial{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--tinta)}
.areas .item{align-items:center}
.toggle{width:40px;height:24px;border-radius:999px;background:var(--dentro);position:relative;flex:none}
.toggle::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--papel)}
.campo{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.campo label{font-size:14px;font-weight:600}
.campo input,.campo select{font:inherit;font-size:16px;color:var(--tinta);background:var(--sup);border:1px solid var(--t2);border-radius:4px;padding:10px 12px;min-height:46px;width:100%}
.campo .grande-in{font-size:28px;font-weight:700}
.nota{font-size:14px;color:var(--t2);margin-top:6px}
.nota b{color:var(--tinta)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--papel);border-radius:6px;padding:10px 14px;display:flex;gap:16px;align-items:center;z-index:30;max-width:calc(100% - 32px)}
.toast button{color:var(--papel);font-weight:700;text-decoration:underline;min-height:36px}
@media (prefers-reduced-motion:no-preference){.folha{animation:sobe .16s ease-out}@keyframes sobe{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="app">
  <div class="tarja"><span><b>Dados fictícios</b> · esboço navegável</span><span>v3</span></div>
  <main id="tela"></main>
</div>
<nav class="barra" aria-label="Destinos"><div class="in">
  <button data-tela="mes" aria-current="page"><span class="ms">calendar_month</span>Mês</button>
  <button data-tela="lancamentos"><span class="ms">receipt_long</span>Lançamentos</button>
  <button class="lancar-wrap" data-acao="lancar" aria-label="Lançar"><span class="lancar"><span class="ms">add</span></span></button>
  <button data-tela="cartao"><span class="ms">credit_card</span>Cartão</button>
  <button data-tela="patrimonio"><span class="ms">account_balance</span>Patrimônio</button>
</div></nav>
<div id="camada"></div>

<script>
// Dados fictícios de novembro de 2026. Todo total é somado das partes (centavos inteiros).
const HOJE = 4, DIAS = 30;
const grupos = [
  ["Alimentação", [["Mercado",60000,54150,52000],["Restaurantes",15000,16500,14000],["Lanches e delivery",20000,11275,18300]]],
  ["Transporte", [["Apps",10000,6048,8900],["Combustível",20000,18080,19500],["Passagens",5000,0,1600]]],
  ["Lazer", [["Jogos",8000,3000,6000],["Hobbies",8000,8400,5200],["Saídas e eventos",15000,3000,12400]]],
  ["Esporte", [["Muay thai",15000,15000,15000]]],
  ["Compras", [["Presentes",10000,12075,4500],["Compras pessoais",15000,12825,13100]]],
  ["Contas e taxas", [["Tarifas bancárias",2000,2000,2000],["Contas da casa",47500,0,46200]]],
  ["Emergência", [["Imprevistos",10000,5250,3300]]],
  ["Outros", [["Outros",7000,3898,5100]]],
]; // [nome, previsto, gasto, média de 3 meses]
const aPagar = [["Seguro do carro",15,15000],["Celular",20,6000],["Conta de luz",28,12000],["Internet",30,10000],["Streaming",30,4500]];
const renda = 420000, guardadoPlan = 145000;
const guardado = [["Reserva",30000,30000],["Investimentos",80000,75000],["Cofrinho Jogos",15000,15000],["Cofrinho Viagem",20000,10000]];
const saldoHoje = 184035, fatura = [11, 84340], freelance = [25, 156840, "US$ 300,00"];

const soma = a => a.reduce((s,x)=>s+x,0);
const cats = grupos.flatMap(([g,l])=>l.map(([n,p,v,m])=>({g,n,p,v,m})));
const previsto = soma(cats.map(c=>c.p)), gasto = soma(cats.map(c=>c.v));
const pagar = soma(aPagar.map(x=>x[2])), livre = previsto - gasto - pagar;
const guardadoReal = soma(guardado.map(x=>x[2])), sobra = renda - gasto - guardadoReal;
const diasRest = DIAS - HOJE + 1;
console.assert(previsto===267500 && gasto===171501 && livre===48499, "régua do mês não fecha");
console.assert(pagar===soma(cats.filter(c=>c.n==="Contas da casa").map(c=>c.p)), "contas a pagar ≠ previsto de Contas da casa");

const brl = c => (c<0?"−":"")+"R$ "+(Math.abs(c)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = c => (Math.abs(c)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (a,b) => Math.round(a/b*100);
const estado = c => c.v > c.p ? "fora" : (c.p>0 && c.v >= .8*c.p && c.n!=="Contas da casa") ? "perto" : "";
const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function projecao(){ // saldo diário da conta corrente, com o livre gasto por igual
  const pts=[]; let s=saldoHoje; const porDia = livre/diasRest;
  for(let d=HOJE; d<=DIAS; d++){
    if(d>HOJE) s -= porDia;
    if(d===fatura[0]) s -= fatura[1];
    if(d===freelance[0]) s += freelance[1];
    aPagar.forEach(([,dia,v])=>{ if(dia===d) s -= v; });
    pts.push([d, Math.round(s)]);
  }
  return pts;
}

function telaMes(){
  const pts = projecao(), fim = pts[pts.length-1][1], min = Math.min(...pts.map(p=>p[1]));
  const W=330,H=110, x=d=>(d-1)/(DIAS-1)*W, max=Math.max(...pts.map(p=>p[1]), saldoHoje);
  const y=v=>H-8 - v/max*(H-24);
  const linha = pts.map(([d,v])=>`${x(d).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const atencao = cats.filter(c=>c.v>c.p).map(c=>({n:c.n, v:c.v, s:`<span class="selo fora">fora</span>de ${brl(c.p)}`, a:"Ver", cat:c.n}));
  atencao.unshift({n:"Fatura Unicred", v:fatura[1], s:`<span class="selo perto">vence em 7 dias</span>11/11`, a:"Pagar"});
  const linhasGrupo = grupos.map(([g])=>{
    const cs = cats.filter(c=>c.g===g);
    return `<div class="grupo"><div class="grupo-cab"><span>${g}</span><span>${brl(soma(cs.map(c=>c.v)))} de ${brl(soma(cs.map(c=>c.p)))}</span></div>
      ${cs.map(c=>{const e=estado(c); const largura = c.p? Math.min(100,c.v/c.p*100):0;
        const dif = c.v - c.m, comp = c.m ? (dif>=0? `${brl(dif)} acima da média` : `${brl(-dif)} abaixo da média`) : "";
        return `<button class="item cat ${e}" data-cat="${esc(c.n)}"><span class="nome">${e?`<span class="selo ${e}">${e}</span>`:""}${esc(c.n)}</span><span class="valor">${brl(c.v)}</span>
        <span class="sub">de ${brl(c.p)}${c.n==="Contas da casa"?" · vencem até 30/11":" · "+comp}</span><span class="sub">${c.p?pct(c.v,c.p)+"%":"—"}</span>
        <span class="barra"><i style="width:${largura}%"></i></span></button>`}).join("")}</div>`;
  }).join("");
  return `
  <header><div><h1>Mês</h1><div class="mes"><button data-acao="mes-ant" aria-label="Mês anterior"><span class="ms">chevron_left</span></button>Novembro de 2026<button data-acao="mes-prox" aria-label="Próximo mês"><span class="ms">chevron_right</span></button></div></div>
    <button class="icone" data-acao="ajustes" aria-label="Ajustes"><span class="ms">settings</span></button></header>

  <div class="heroi">
    <div class="rot">Livre para gastar até 30/11</div>
    <div class="grande">${brl(livre)}</div>
    <p class="conta">${brl(Math.round(livre/diasRest))} por dia nos ${diasRest} dias · previsto − gasto − a pagar</p>
    <div class="trilho" role="img" aria-label="Gasto ${pct(gasto,previsto)}%, a pagar ${pct(pagar,previsto)}% do previsto"><i style="width:${gasto/previsto*100}%;background:var(--heroi-t)"></i><i style="width:${pagar/previsto*100}%;background:var(--azul-claro)"></i></div>
    <div class="tres">
      <div><div class="r">Previsto</div><div class="v">${num(previsto)}</div></div>
      <div><div class="r"><span class="dot" style="background:var(--heroi-t)"></span>Gasto</div><div class="v">${num(gasto)}</div></div>
      <div><div class="r"><span class="dot" style="background:var(--azul-claro)"></span>A pagar</div><div class="v">${num(pagar)}</div></div>
    </div>
    <div class="pe"><span>${pct(gasto,previsto)}% gasto · dia ${HOJE} de ${DIAS}</span><button class="btn-claro" data-acao="chat" data-contexto="mes"><span class="ms" style="font-size:18px">auto_awesome</span>Perguntar</button></div>
  </div>

// ---- folhas
const camada = document.getElementById("camada");
function abrir(html){ camada.innerHTML = `<div class="veu" data-acao="fechar"><div class="folha" role="dialog" aria-modal="true">${html}</div></div>`; camada.querySelector(".folha button")?.focus(); }
function fechar(){ camada.innerHTML=""; }

const respostas = {
  mes: [
    ["Avalie meu orçamento", `Você gastou ${brl(gasto)} de ${brl(previsto)} (64%) no dia 4, com ${brl(pagar)} de contas ainda a pagar. Três categorias passaram do previsto: Presentes (+${brl(2075)}), Restaurantes (+${brl(1500)}) e Hobbies (+${brl(400)}).`, `com base em: gasto, previsto e a pagar de novembro`],
    ["Onde gastei mais?", `Mercado: ${brl(54150)}, 32% do gasto do mês. Depois Combustível (${brl(18080)}) e Restaurantes (${brl(16500)}).`, `com base em: gasto por categoria`],
    ["Como melhorar?", `Restaurantes já está ${brl(2500)} acima da média de 3 meses. Segurar a categoria no previsto até o fim do mês mantém o livre em ${brl(livre)}; repetir o ritmo atual o reduziria em cerca de ${brl(Math.round(16500/HOJE*(DIAS-HOJE)) )}.`, `com base em: Restaurantes ${brl(16500)} em ${HOJE} dias, média ${brl(14000)}`],
  ],
  inv: [
    ["O que mudou na carteira?", `O valor investido subiu R$ 420,79 no mês. EXEMP11 foi o que mais subiu (+5,5% sobre o preço médio) e TESTE11 o que mais caiu (−5,3%). FI-Infra está em 28% da carteira, contra meta de 10%.`, `com base em: variação por ativo e alocação × meta`],
    ["O que é P/VP?", `Preço sobre valor patrimonial: quanto o mercado paga por cada real de patrimônio do fundo. 0,88 (TESTE11) é abaixo do patrimônio; 1,03 (FICTA11), acima. Não diz sozinho se é bom ou ruim.`, `com base em: glossário e P/VP da carteira`],
    ["Devo vender TESTE11?", `Não faço recomendação de investimento. O Onde aportar aplica as suas regras.`, `regra fixa do chat`],
  ],
  cat: n => { const c = cats.find(x=>x.n===n); return [
    ["Onde gastei mais?", n==="Mercado"? `Supermercado Bom Preço: R$ 221,50 em 1 compra (41% da categoria), e Supermercado no cartão: R$ 318,40.` : `Em ${n}, ${brl(c.v)} no mês até hoje; o maior lançamento foi de ${brl(Math.round(c.v*0.6))}.`, `com base em: lançamentos de ${n} em novembro (aprovado enviar)`],
    ["Isso é normal?", c.m? `${c.v>=c.m?"Acima":"Abaixo"} do normal: a média dos últimos 3 meses é ${brl(c.m)}, e este mês já está em ${brl(c.v)} no dia ${HOJE}.` : "Não há histórico suficiente nesta categoria.", `com base em: média de 3 meses`],
    ["Como diminuir?", c.v>0? `Para fechar no previsto de ${brl(c.p)}, o resto do mês comporta ${brl(Math.max(0,c.p-c.v))}, cerca de ${brl(Math.max(0,Math.round((c.p-c.v)/diasRest)))} por dia.` : `Nada gasto ainda; o previsto é ${brl(c.p)}.`, `com base em: previsto − gasto, ${diasRest} dias restantes`],
  ];}
};
function chat(contexto, nome){
  const lista = contexto==="mes"? respostas.mes : contexto==="inv"? respostas.inv : respostas.cat(nome);
  const titulo = contexto==="mes"? "Orçamento de novembro" : contexto==="inv"? "Investimentos" : `${nome} · novembro`;
  abrir(`<div class="topo"><h3>${esc(titulo)}</h3><button class="icone" data-acao="fechar" aria-label="Fechar"><span class="ms">close</span></button></div>
    <div class="chips">${lista.map((q,i)=>`<button class="chip" data-acao="pergunta" data-i="${i}">${q[0]}</button>`).join("")}</div>
    <div id="conversa" aria-live="polite"></div>
    <p class="aviso">Esboço: respostas de exemplo, fixas. No app, a IA escolhe as consultas e o app confere cada número.</p>`);
  camada.querySelector(".folha").dataset.ctx = contexto; camada.querySelector(".folha").dataset.nome = nome||"";
}
function detalhe(nome){
  const c = cats.find(x=>x.n===nome), e = estado(c);
  const hist = [c.m*0.9,c.m*1.1,c.m*0.95,c.m*1.05,c.m,c.m*0.85,c.m*1.2,c.m*0.9,c.m*1.0,c.m*1.1,c.m*0.9,c.v].map(Math.round);
  const mx = Math.max(...hist, c.p, 1);
  abrir(`<div class="topo"><h3>${esc(nome)}</h3><button class="icone" data-acao="fechar" aria-label="Fechar"><span class="ms">close</span></button></div>
    <div style="font-size:30px;font-weight:700;letter-spacing:-.02em">${brl(c.v)}</div>
    <div class="sub">${e?`<span class="selo ${e}">${e}</span>`:""}de ${brl(c.p)} previstos · média de 3 meses ${brl(c.m)}</div>
    <div class="colunas" role="img" aria-label="Gasto nos últimos 12 meses">${hist.map((v,i)=>`<i class="${i===11?"atual":""}" style="height:${Math.max(2,v/mx*100)}%"></i>`).join("")}</div>
    <div class="colunas-rot"><span>dez/25</span><span>nov/26</span></div>
    <div class="rodape"><button class="btn" data-acao="chat" data-contexto="cat" data-nome="${esc(nome)}"><span class="ms" style="font-size:18px">auto_awesome</span>Perguntar sobre ${esc(nome)}</button><button class="btn" data-acao="breve">Ajustar previsto deste mês</button></div>`);
}

document.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-tela],[data-acao],[data-cat]"); if(!t) return;
  if(t.classList.contains("veu") && ev.target!==t) return;
  if(t.dataset.tela){ mostrar(t.dataset.tela); return; }
  if(t.dataset.cat && !t.dataset.acao){ detalhe(t.dataset.cat); return; }
  const a = t.dataset.acao; ev.preventDefault();
  if(a==="fechar") fechar();
  else if(a==="chat") chat(t.dataset.contexto, t.dataset.nome);
  else if(a==="pergunta"){ const f=camada.querySelector(".folha"); const l = f.dataset.ctx==="mes"? respostas.mes : f.dataset.ctx==="inv"? respostas.inv : respostas.cat(f.dataset.nome); const [q,r,b]=l[+t.dataset.i];
    document.getElementById("conversa").insertAdjacentHTML("beforeend", `<div class="msg eu">${q}</div><div class="msg ia">${r}<span class="base">${b}</span></div>`); }
  else if(a==="copiar"){ const txt = `Novembro/2026 · previsto ${brl(previsto)} · gasto ${brl(gasto)} · a pagar ${brl(pagar)} · livre ${brl(livre)} · guardado ${brl(guardadoReal)} de ${brl(guardadoPlan)}`;
    const ok=()=>document.getElementById("copiado").textContent="Resumo copiado.";
    try{ navigator.clipboard.writeText(txt).then(ok, ()=>{document.getElementById("copiado").textContent=txt;}); }catch(e){ document.getElementById("copiado").textContent=txt; } }
  else if(a==="lancar"||a==="intencao") lancar(t.dataset.int);
  else if(a==="pagar") lancar("Paguei a fatura");
  else if(a==="ajustes") mostrar("ajustes");
  else if(a==="voltar") mostrar(telaAntes);
  else if(a==="filtro"){ estadoTela.filtro=t.dataset.f; redesenhar(); }
  else if(a==="fatura"){ estadoTela.fatura=+t.dataset.i; redesenhar(); }
  else if(a==="aba"){ estadoTela.aba=t.dataset.a; redesenhar(); }
  else if(a==="desfazer"){ document.querySelector(".toast")?.remove(); }
  else if(a==="editar"){ const l=lanc[+t.dataset.i]; abrir(`<div class="topo"><h3>Editar lançamento</h3><button class="icone" data-acao="fechar" aria-label="Fechar"><span class="ms">close</span></button></div>
      <div class="campo"><label for="e-desc">Descrição</label><input id="e-desc" value="${esc(l[1])}"></div><div class="campo"><label for="e-val">Valor (R$)</label><input id="e-val" class="grande-in" value="${num(l[4])}"></div>
      <p class="nota">${esc([l[2],l[3]].filter(Boolean).join(" · "))}</p><div style="margin-top:16px"><button class="btn-tinta" data-acao="salvo">Salvar</button></div>
      <div class="rodape"><button class="btn" data-acao="excluido" style="color:var(--fora)">Excluir “${esc(l[1])}”</button></div>`); }
  else if(a==="salvo"){ fechar(); toast("Lançamento salvo."); }
  else if(a==="excluido"){ fechar(); toast("Lançamento excluído."); }
  else if(a==="colar") abrir(`<div class="topo"><h3>Colar notificação</h3><button class="icone" data-acao="fechar" aria-label="Fechar"><span class="ms">close</span></button></div>
      <div class="campo"><label for="c-txt">Texto da notificação ou do SMS</label><input id="c-txt" value="Compra aprovada de R$ 42,50 em IFOOD *RESTAURANTE em 03/11"></div>
      <p class="nota">Li: <b>R$ 42,50 · IFOOD RESTAURANTE · 03/11 · cartão</b></p><div style="margin-top:16px"><button class="btn-tinta" data-acao="lancar" data-int="Gastei">Abrir em Gastei</button></div>`);
  else if(a==="importar") abrir(`<div class="topo"><h3>Importar extrato</h3><button class="icone" data-acao="fechar" aria-label="Fechar"><span class="ms">close</span></button></div>
      <p class="sub">PicPay, em PDF. Nada é gravado antes de você revisar e confirmar; o fechamento é conferido pelo saldo diário impresso.</p><div class="rodape"><button class="btn" data-acao="breve"><span class="ms" style="font-size:18px">upload_file</span>Escolher o PDF</button></div>`);
  else if(a==="conciliar") abrir(`<div class="topo"><h3>Conciliar saldo</h3><button class="icone" data-acao="fechar" aria-label="Fechar"><span class="ms">close</span></button></div>
      <div class="campo"><label for="k-val">Quanto o PicPay mostra agora (R$)</label><input id="k-val" class="grande-in" value="1.840,35"></div><p class="nota">Igual ao app: <b>diferença R$ 0,00</b>. Salvar grava a conciliação de hoje.</p><div style="margin-top:16px"><button class="btn-tinta" data-acao="salvo">Salvar</button></div>`);
  else if(a==="mes-ant"||a==="mes-prox"||a==="breve") abrir(`<div class="topo"><h3>Fora do esboço</h3><button class="icone" data-acao="fechar" aria-label="Fechar"><span class="ms">close</span></button></div><p class="sub">Este esboço tem só novembro e não abre este detalhe. O briefing completo está em docs/v3/06b-telas.md.</p>`);
});
document.addEventListener("submit", e=>{ if(e.target.id==="form-lancar"){ e.preventDefault(); fechar(); toast("Lançado."); } });
document.addEventListener("change", e=>{ if(e.target.id==="f-conta"){ document.getElementById("nota-cartao").hidden = !e.target.value.startsWith("Unicred"); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") fechar(); });
mostrar("mes");
</script>
