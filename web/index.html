<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)" />
    <title>Financeiro pessoal</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 7);
        var a = (window.__adiantados = {});
        ["/api/mes?mes=" + d, "/api/sessao"].forEach(function (u) { a[u] = fetch(u, { headers: { accept: "application/json" } }); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
