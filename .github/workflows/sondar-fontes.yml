name: Sondar fontes de cotação (temporário)
on:
  push:
    branches: [chore/sondar-fontes]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: CVM linhas do MXRF11
        run: |
          curl -sSL -o d.zip https://dados.cvm.gov.br/dados/FII/DOC/INF_MENSAL/DADOS/inf_mensal_fii_2026.zip
          unzip -q -o d.zip -d d
          echo "=== complemento"; grep -a "97.521.225/0001-25\|97521225000125" d/inf_mensal_fii_complemento_2026.csv | iconv -f latin1 -t utf-8 | tail -4
          echo "=== geral"; grep -a "97.521.225/0001-25\|97521225000125" d/inf_mensal_fii_geral_2026.csv | iconv -f latin1 -t utf-8 | tail -2 | cut -c1-400
          echo "=== linhas por mês"; cut -d';' -f2 d/inf_mensal_fii_complemento_2026.csv | sort | uniq -c
          echo "=== versões repetidas?"; cut -d';' -f1,2 d/inf_mensal_fii_complemento_2026.csv | sort | uniq -d | head -3
          file d/*.csv
      - name: B3 layout e linhas
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          curl -sSL -A "Mozilla/5.0" -o l.pdf "https://www.b3.com.br/data/files/33/67/B9/50/D84057102C784E47AC094EA8/SeriesHistoricas_Layout.pdf" -w "%{http_code}\n"
          pdftotext -layout l.pdf - | head -150 || true
          curl -sSL -o c.zip https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D04112026.ZIP && unzip -q -o c.zip
          head -1 COTAHIST_D04112026.TXT; grep -a "MXRF11 \|HGLG11 \|KNCR11 " COTAHIST_D04112026.TXT; tail -1 COTAHIST_D04112026.TXT
          echo "=== codbdi 12 amostra"; awk 'substr($0,11,2)=="12"' COTAHIST_D04112026.TXT | wc -l
