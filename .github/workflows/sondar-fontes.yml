name: Sondar fontes de cotação (temporário)
on:
  push:
    branches: [chore/sondar-fontes]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: CVM dicionário
        run: |
          set -x
          curl -sSL -o meta.zip https://dados.cvm.gov.br/dados/FII/DOC/INF_MENSAL/META/meta_inf_mensal_fii.zip
          unzip -o meta.zip -d meta && ls -la meta
          for f in meta/*; do echo "=== $f"; iconv -f latin1 -t utf-8 "$f" | grep -i -E "^ *(Campo|Nome)|Campo:|Dividend|Rentab|Patrimonial|Rendimento|ISIN|Codigo|Cotas|Data_Referencia|CNPJ" | head -80; done
      - name: CVM dados 2026
        run: |
          curl -sSL -o d.zip https://dados.cvm.gov.br/dados/FII/DOC/INF_MENSAL/DADOS/inf_mensal_fii_2026.zip
          unzip -o d.zip -d d && ls -la d
          for f in d/*.csv; do echo "=== $f"; head -1 "$f" | iconv -f latin1 -t utf-8; grep -i "MAXI RENDA" "$f" | tail -2 | iconv -f latin1 -t utf-8 | cut -c1-900; done
      - name: brapi sem token
        run: |
          for t in MXRF11 KNCR11 HGLG11; do echo "=== $t"; curl -sS "https://brapi.dev/api/quote/$t" | head -c 1500; echo; done
          echo "=== range"; curl -sS "https://brapi.dev/api/quote/MXRF11?range=5d&interval=1d" | head -c 800; echo
          echo "=== fii indicators"; curl -sS "https://brapi.dev/api/v2/fii/indicators?symbols=MXRF11" | head -c 1500; echo
          echo "=== fii dividends"; curl -sS "https://brapi.dev/api/v2/fii/dividends?symbols=MXRF11" | head -c 1500; echo
      - name: B3 COTAHIST diário
        run: |
          d=$(TZ=America/Sao_Paulo date -d "yesterday" +%d%m%Y)
          for u in "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D$d.ZIP" "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D04112026.ZIP"; do echo "=== $u"; curl -sS -L -o c.zip -w "%{http_code} %{size_download}\n" "$u"; unzip -l c.zip 2>&1 | head; done
