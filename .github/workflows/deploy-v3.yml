name: Deploy da v3 (Cloudflare Worker)

# ADR-015 e ADR-018: o deploy sai daqui, e os secrets do GitHub chegam ao Worker
# pelo `secrets:` do wrangler-action. Até o corte (fatia 11) o Worker vive em
# *.workers.dev e não toca no app do Community Cloud.
on:
  push:
    branches: [replanejamento/v3]
  workflow_dispatch:

concurrency:
  group: deploy-v3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets da Cloudflare cadastrados?
        id: tem
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ainda não cadastrado; deploy pulado (ADR-015, passo a passo)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tem.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.tem.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        if: steps.tem.outputs.ok == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: steps.tem.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.151.2"
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_APP }}
      # Os do login são opcionais: o wrangler-action falha com valor vazio, então
      # cada um só sobe se existir. Sem eles o Worker fica sem login e todo mundo
      # cai no demo, que é o comportamento seguro (ADR-017).
      - name: Secrets do login, se cadastrados
        if: steps.tem.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          for nome in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SESSION_SECRET; do
            if [ -n "${!nome}" ]; then
              printf '%s' "${!nome}" | npx wrangler secret put "$nome" >/dev/null
              echo "$nome enviado."
            else
              echo "::notice::$nome não cadastrado; login desligado."
            fi
          done

      # De fora, sem login: o app publicado cai no demo, não mostra dado real, não chama a IA,
      # não deixa administrar acessos nem forjar sessão, e não expõe segredo no que serve.
      - name: Teste de segurança no app publicado
        run: node scripts/teste_seguranca_v3.mjs
