name: Cotações dos FIIs

# RF10: uma leitura por dia, depois do fechamento do pregão (19:30 em Brasília).
# Só dos tickers em carteira de alguém. A tela lê do banco, nunca da web.
# Por enquanto no branch dev do Neon; produção entra no corte (fatia 11), com o papel `jobs`.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: cotacoes
  cancel-in-progress: false

jobs:
  cotacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Atualizar cotações
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_OWNER_DEV }}
        run: uv run python jobs/atualizar_cotacoes.py
